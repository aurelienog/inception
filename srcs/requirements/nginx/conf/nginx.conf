user www-data;
worker_processes auto;

pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 443 ssl;
        server_name aunoguei.42.fr;

        root /var/www/html;
        index index.php index.html;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            try_files $uri =404;

            include /etc/nginx/fastcgi_params;
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
        }

        location = /adminer {
            return 301 /adminer/;
        }

        # Archivos CSS y JavaScript de Adminer
        location ^~ /adminer/static/ {
            alias /var/www/adminer/static/;
            expires 7d;
            access_log off;
        }

        # Adminer app througt PHP-FPM
        location ^~ /adminer/ {
            rewrite ^/adminer/(.*)$ /$1 break;

            include /etc/nginx/fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/adminer;
            fastcgi_param HTTPS on;

            fastcgi_pass adminer:9000;
        }

        # extern Adminer resources
        location ^~ /externals/ {
            alias /var/www/adminer/externals/;
            expires 7d;
            access_log off;
        }

        location = /resume {
            return 301 /resume/;
        }

        location ^~ /resume/ {
            proxy_pass http://website:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /status {
            return 301 /status/;
        }

        location ^~ /status/ {
            proxy_pass http://status:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ /\. {
            deny all;
        }
    }
}