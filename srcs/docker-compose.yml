services:

  nginx:
    image: nginx:1.0
    container_name: nginx
    build:
      context: ./requirements/nginx
    restart: always
    volumes:
      - wordpress:/var/www/html:ro
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception

  wordpress:
    image: wordpress:1.0
    container_name: wordpress
    build:
      context: ./requirements/wordpress
    restart: always
    networks:
      - inception
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html

  mariadb:
    image: mariadb:1.0
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    restart: always
    networks:
      - inception
    secrets:
      - db_root_password
      - db_password
    env_file:
      - .env
    volumes:
      - mariadb:/var/lib/mysql

networks:
  inception:
    driver: bridge

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aunoguei/data/wordpress

  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aunoguei/data/mariadb


secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt